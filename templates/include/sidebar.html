<ul class="sidebar-nav list-group">
	{% if user.is_authenticated %}
		<li class="list-group-item">Username: <a href="{{ user.get_absolute_url }}">{{ user.get_username }}</a></li>
		<li class="list-group-item">
			<form action="{% url 'logout' %}" method="post">
				{% csrf_token %}
				<button type="submit" class="btn btn-link">Logout</button>
			</form>
		</li>

	{% else %}
		<li class="list-group-item"><a href="{% url 'login' %}?next={{ request.path }}">Login</a></li>
	{% endif %}

	<br>

	<li class="list-group-item"><a href="{% url 'security:index' %}">Home</a></li>
	<li class="list-group-item"><a href="{% url 'security:guard-list' %}">Guard</a></li>
	<li class="list-group-item"><a href="{% url 'security:object-list' %}">Object</a></li>
	<li class="list-group-item"><a href="{% url 'security:event-list' %}">Event</a></li>
</ul>
